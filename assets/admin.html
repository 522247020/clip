<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>剪贴板 · 后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e6b54e'/%3E%3Cg fill='%231a1406'%3E%3Crect x='8' y='8' width='16' height='3.5' rx='1.75'/%3E%3Crect x='8' y='14.25' width='16' height='3.5' rx='1.75'/%3E%3Crect x='8' y='20.5' width='9' height='3.5' rx='1.75'/%3E%3C/g%3E%3C/svg%3E">
<style>__CSS__</style></head><body><main class="wide">

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>后台</h1>
      <p class="hint">文件 · 长期下载 · 访问记录，数据存于 SQLite</p>
    </div>
  </div>
  <div class="tools">
    <span class="chip">__CHIP__</span>
    <a class="btn" href="__HOME__">返回剪贴板</a>
    <button class="iconbtn" id="theme" type="button" aria-label="切换主题"></button>
    <button class="btn" id="logoutBtn" type="button">退出登录</button>
  </div>
</header>

<section>
  <p class="section-label">文件</p>
  <div class="panel"><table id="files"><thead><tr><th>名称</th><th>类型</th><th>大小</th><th>更新时间</th><th>下载</th><th>操作</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <p class="section-label">长期下载</p>
  <form class="share" id="shareForm">
    <div class="field"><label>文件</label><select id="shareName"></select></div>
    <div class="field"><label>有效期</label><select id="shareExp"><option value="0">永久</option><option value="86400">1 天</option><option value="604800">7 天</option><option value="2592000">30 天</option></select></div>
    <div class="field"><label>次数上限</label><input id="shareMax" type="number" min="0" value="0" style="width:110px"></div>
    <div class="field"><label>备注</label><input id="shareNote" placeholder="可选"></div>
    <button class="primary" type="submit">创建链接</button>
  </form>
  <div id="shareResult"></div>
  <div class="panel"><table id="shares"><thead><tr><th>链接</th><th>创建</th><th>有效期</th><th>下载</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <p class="section-label">访问记录</p>
  <div class="row">
    <button id="refreshLogs" type="button">刷新</button>
    <button class="danger" id="clearLogs" type="button">清空日志</button>
    <span id="msg" role="status"></span>
  </div>
  <div class="panel"><table id="logs"><thead><tr><th>时间</th><th>IP</th><th>方法</th><th>路径</th><th>状态</th><th>大小</th><th>UA</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <p class="section-label">后台口令</p>
  <p class="hint" style="margin-top:0">__PWDNOTE__</p>
  <form class="share" id="pwdForm">
    <div class="field"><label>当前口令</label><input id="pwdCur" type="password" autocomplete="current-password" placeholder="未设置可留空"></div>
    <div class="field"><label>新口令</label><input id="pwdNew" type="password" autocomplete="new-password" placeholder="至少 4 位"></div>
    <div class="field"><label>确认新口令</label><input id="pwdNew2" type="password" autocomplete="new-password"></div>
    <button class="primary" type="submit">修改口令</button>
  </form>
</section>

<footer class="foot-line">
  <span>DB __DB__ · 长期下载 __SHAREDIR__</span>
  <span>__VER__</span>
</footer>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <p id="modalText"></p>
    <div class="modal-actions">
      <button id="modalCancel" type="button">取消</button>
      <button id="modalOk" class="danger" type="button">确定</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='clip-theme',root=document.documentElement,btn=document.getElementById('theme');
  function pref(){return root.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}
  function paint(){if(!btn)return;var p=pref();btn.textContent=p==='light'?'\u263e':'\u2600';btn.title=p==='light'?'切换到暗色':'切换到亮色';}
  var saved=localStorage.getItem(KEY);if(saved)root.setAttribute('data-theme',saved);
  if(btn)btn.addEventListener('click',function(){var next=pref()==='light'?'dark':'light';root.setAttribute('data-theme',next);localStorage.setItem(KEY,next);paint();});
  paint();
})();
</script>
<script>
const BASE=__BASE_JSON__;
const msg=document.getElementById('msg');
const toast=document.getElementById('toast');
let toastTimer=null;
function setMsg(t,c){
  if(msg){msg.textContent=t;msg.className=c||'';}
  if(toast){
    toast.textContent=t;
    toast.className='toast show'+(c?' '+c:'');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{toast.className='toast'+(c?' '+c:'');},2400);
  }
}
async function api(path,opts){
  const r=await fetch(path,opts||{});
  if(r.status===401){location.href=BASE+'/login';throw new Error('unauthorized');}
  return r;
}

/* 自定义全屏确认框 */
const modal=document.getElementById('modal'),modalText=document.getElementById('modalText'),modalOk=document.getElementById('modalOk');
let modalResolve=null;
function ask(text,okLabel){
  return new Promise(res=>{modalText.textContent=text;modalOk.textContent=okLabel||'确定';modal.hidden=false;modalResolve=res;});
}
function closeModal(v){modal.hidden=true;if(modalResolve){const r=modalResolve;modalResolve=null;r(v);}}
modalOk.onclick=()=>closeModal(true);
document.getElementById('modalCancel').onclick=()=>closeModal(false);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal(false);});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){const u=['B','KB','MB','GB'];let i=0;n=Number(n)||0;while(n>=1024&&i<3){n/=1024;i++;}return (i?n.toFixed(1):n)+u[i];}
function time(t){if(!t)return '—';return new Date(t*1000).toLocaleString();}
function label(n){return n===''?'／（根内容）':'/'+n;}

async function loadFiles(){
  const r=await api(BASE+'/api/files');const files=await r.json();
  const tb=document.querySelector('#files tbody');
  const sel=document.getElementById('shareName');
  tb.innerHTML='';sel.innerHTML='<option value="">／（根内容）</option>';
  if(!files.length){tb.innerHTML='<tr><td colspan="6" class="muted">暂无文件</td></tr>';return;}
  for(const f of files){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="mono">${esc(label(f.name))}</td>
      <td class="muted">${esc(f.content_type)}</td>
      <td class="mono">${fmt(f.size)}</td>
      <td class="mono muted">${time(f.updated_at)}</td>
      <td class="mono">${f.downloads}</td>
      <td><div class="actions"><a class="btn mini" href="${esc(f.url)}" target="_blank" rel="noreferrer">打开</a><button class="mini danger" data-del="${esc(f.name)}">删除</button></div></td>`;
    tb.appendChild(tr);
    const o=document.createElement('option');o.value=f.name;o.textContent=label(f.name)+'  '+fmt(f.size);sel.appendChild(o);
  }
  tb.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
    if(!await ask('删除文件「'+label(b.dataset.del)+'」？','删除'))return;
    await api(BASE+'/api/files?name='+encodeURIComponent(b.dataset.del),{method:'DELETE'});
    setMsg('已删除','ok');loadFiles();loadShares();
  });
}

async function loadShares(){
  const r=await api(BASE+'/api/shares');const shares=await r.json();
  const tb=document.querySelector('#shares tbody');tb.innerHTML='';
  if(!shares.length){tb.innerHTML='<tr><td colspan="6" class="muted">暂无长期链接</td></tr>';return;}
  for(const s of shares){
    const expired=s.expires_at&&s.expires_at*1000<Date.now();
    const over=s.max_downloads&&s.downloads>=s.max_downloads;
    const url=location.origin+'/d/'+s.token;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><span class="link">${esc(url)}</span><br><span class="muted">${esc(label(s.name))} · ${fmt(s.size)}${s.note?' · '+esc(s.note):''}</span></td>
      <td class="mono muted">${time(s.created_at)}</td>
      <td class="mono">${s.expires_at?time(s.expires_at):'永久'}</td>
      <td class="mono">${s.downloads}${s.max_downloads?' / '+s.max_downloads:''}</td>
      <td>${expired||over?'<span class="pill bad">失效</span>':'<span class="pill ok">有效</span>'}</td>
      <td><div class="actions"><button class="mini" data-copy="${esc(url)}">复制</button><button class="mini danger" data-rm="${esc(s.token)}">删除</button></div></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy);setMsg('链接已复制','ok');});
  tb.querySelectorAll('button[data-rm]').forEach(b=>b.onclick=async()=>{
    if(!await ask('删除该长期链接？','删除'))return;
    await api(BASE+'/api/shares?token='+encodeURIComponent(b.dataset.rm),{method:'DELETE'});
    setMsg('已删除','ok');loadShares();
  });
}

document.getElementById('shareForm').onsubmit=async e=>{
  e.preventDefault();
  const body=JSON.stringify({
    name:document.getElementById('shareName').value,
    expires_in:document.getElementById('shareExp').value,
    max_downloads:document.getElementById('shareMax').value,
    note:document.getElementById('shareNote').value
  });
  const r=await api(BASE+'/api/shares',{method:'POST',headers:{'Content-Type':'application/json'},body});
  const j=await r.json();
  if(!r.ok){setMsg(j.error||'创建失败','err');return;}
  const url=location.origin+j.url;
  document.getElementById('shareResult').innerHTML='<div class="panel pad"><span class="link">'+esc(url)+'</span> <button class="mini" id="copyNew" type="button">复制</button></div>';
  document.getElementById('copyNew').onclick=()=>{navigator.clipboard.writeText(url);setMsg('已复制','ok');};
  setMsg('已创建长期链接','ok');loadShares();
};

async function loadLogs(){
  const r=await api(BASE+'/api/logs?limit=300');const logs=await r.json();
  const tb=document.querySelector('#logs tbody');tb.innerHTML='';
  if(!logs.length){tb.innerHTML='<tr><td colspan="7" class="muted">暂无记录</td></tr>';return;}
  for(const l of logs){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="mono muted">${time(l.ts)}</td>
      <td class="mono">${esc(l.ip)}</td>
      <td class="mono">${esc(l.method)}</td>
      <td class="mono">${esc(l.path)}</td>
      <td class="mono">${l.status}</td>
      <td class="mono muted">${fmt(l.bytes)}</td>
      <td class="muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l.user_agent)}">${esc(l.user_agent)}</td>`;
    tb.appendChild(tr);
  }
}
document.getElementById('refreshLogs').onclick=loadLogs;
document.getElementById('clearLogs').onclick=async()=>{
  if(!await ask('清空全部访问记录？此操作不可撤销。','清空'))return;
  await api(BASE+'/api/logs',{method:'DELETE'});
  setMsg('日志已清空','ok');loadLogs();
};

document.getElementById('logoutBtn').onclick=()=>{location.href=BASE+'/logout';};

document.getElementById('pwdForm').onsubmit=async e=>{
  e.preventDefault();
  const cur=document.getElementById('pwdCur').value;
  const nw=document.getElementById('pwdNew').value;
  const nw2=document.getElementById('pwdNew2').value;
  if(nw.length<4){setMsg('新口令至少 4 位','err');return;}
  if(nw!==nw2){setMsg('两次输入不一致','err');return;}
  const r=await api(BASE+'/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:cur,new:nw})});
  const j=await r.json();
  if(!r.ok){setMsg(j.error||'修改失败','err');return;}
  setMsg('口令已修改，请重新登录','ok');
  setTimeout(()=>{location.href=BASE+'/login';},900);
};

loadFiles();loadShares();loadLogs();
</script>
</body></html>
