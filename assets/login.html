<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>后台登录 · 剪贴板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e6b54e'/%3E%3Cg fill='%231a1406'%3E%3Crect x='8' y='8' width='16' height='3.5' rx='1.75'/%3E%3Crect x='8' y='14.25' width='16' height='3.5' rx='1.75'/%3E%3Crect x='8' y='20.5' width='9' height='3.5' rx='1.75'/%3E%3C/g%3E%3C/svg%3E">
<style>__CSS__</style></head><body>
<div class="login-wrap">
  <form class="login-card" method="post" action="__ACTION__">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="3"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        <circle cx="12" cy="15.5" r="1.4"/>
      </svg>
    </span>
    <h1>后台登录</h1>
    <p class="hint">__ERROR__</p>
    <input type="password" name="password" placeholder="口令" autofocus autocomplete="current-password" required>
    <button class="primary" type="submit">登录</button>
    <div class="foot-line" style="justify-content:center;border:0;margin-top:18px;padding:0">
      <span>__VER__</span>
    </div>
  </form>
</div>
<script>
(function(){
  var KEY='clip-theme',root=document.documentElement;
  var saved=localStorage.getItem(KEY);if(saved)root.setAttribute('data-theme',saved);
})();
</script>
</body></html>
